<header class="pdv-header">


  <!-- BOUTON MENU -->

  <button
    type="button"
    class="menu-button"
    (click)="openMenu()"
    aria-label="Ouvrir le menu"
  >

    <span></span>
    <span></span>
    <span></span>

  </button>


  <!-- TITRE -->

  <div class="pdv-title">

    <div class="title-icon">
      R
    </div>

    <div class="title-content">

      <strong>
        Point de vente
      </strong>

      <span>
        Restaurant
      </span>

    </div>

  </div>


  <!-- PARTIE DROITE -->

  <div class="header-right">


    <!-- CONNEXION -->

    <div class="connection-status">

      <span class="connection-dot"></span>

      <span>
        En ligne
      </span>

    </div>


    <!-- NOTIFICATION -->

    <button
      type="button"
      class="notification-button"
      aria-label="Notifications"
    >

      🔔

    </button>


    <div class="separator"></div>


    <!-- UTILISATEUR -->

    <div class="user">

      <div class="user-avatar">
        A
      </div>

      <div class="user-info">

        <strong>
          Admin
        </strong>

        <span>
          Administrateur
        </span>

      </div>


      <button
        type="button"
        class="logout-button"
        aria-label="Déconnexion"
      >

        ⋮

      </button>

    </div>

  </div>

</header>
