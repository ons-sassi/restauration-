<section class="page-header">

  <div class="header-left">

    @if (showBackButton) {

      <button
        type="button"
        class="back-button"
        (click)="back()"
        aria-label="Retour"
      >
        ←
      </button>

    }

    <div>

      @if (breadcrumb.length > 0) {

        <div class="breadcrumb">

          @for (
            item of breadcrumb;
            track $index;
            let last = $last
            ) {

            <span
              [class.current]="last"
            >
              {{ item }}
            </span>

            @if (!last) {
              <span class="separator">
                /
              </span>
            }

          }

        </div>

      }

      <h1>
        {{ title }}
      </h1>

      @if (description) {

        <p>
          {{ description }}
        </p>

      }

    </div>

  </div>


  <!-- Actions injectées par la page -->
  <div class="header-actions">
    <ng-content></ng-content>
  </div>

</section>
